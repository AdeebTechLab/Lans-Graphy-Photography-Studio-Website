<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LensCraft Portal | Restricted Admin Access</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Dedicated Admin Portal Styling */
    .admin-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
    }

    .admin-top-bar {
      height: 70px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .admin-brand span { color: var(--accent-gold); }
    .admin-badge-lock {
      background: rgba(197, 168, 128, 0.15);
      border: 1px solid var(--border-gold);
      color: var(--accent-gold);
      font-size: 0.72rem;
      font-family: var(--font-sans);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-weight: 700;
      margin-left: 0.5rem;
    }

    /* Login Gateway Screen */
    .login-overlay {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
    }

    .login-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent-gold-light);
      border: 2px solid var(--border-gold);
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
      font-size: 1.8rem;
    }

    .login-card h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .login-card p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .login-field {
      margin-bottom: 1.25rem;
      text-align: left;
    }

    .login-field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }

    .login-field input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .login-field input:focus {
      outline: none;
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px var(--accent-gold-light);
    }

    .login-hint {
      margin-top: 1.5rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      background: var(--bg-secondary);
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px dashed var(--border-color);
    }

    /* Dashboard UI Elements */
    .dashboard-container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem 1.5rem;
      width: 100%;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      box-shadow: var(--card-shadow);
    }

    .stat-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: var(--accent-gold-light);
      border: 1px solid var(--border-gold);
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .stat-info h4 {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .stat-info .stat-value {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1;
    }

    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--card-shadow);
      overflow-x: auto;
    }

    .table-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .search-input {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.65rem 1.2rem;
      border-radius: 50px;
      font-size: 0.9rem;
      min-width: 260px;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.92rem;
    }

    .data-table th, .data-table td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
    }

    .data-table th {
      background: var(--bg-secondary);
      color: var(--accent-gold);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
    }

    .data-table tr:hover {
      background: var(--bg-secondary);
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-pending { background: rgba(234, 179, 8, 0.15); color: #eab308; border: 1px solid rgba(234, 179, 8, 0.3); }
    .status-confirmed { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-completed { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }

    .action-btn-group {
      display: flex;
      gap: 0.45rem;
    }
  </style>
</head>
<body>

  <!-- React Application Mount Point -->
  <div id="react-admin-root"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

  <!-- REACT AUTHENTICATED ADMIN COMPONENT -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Secure Studio Credentials
    const ADMIN_CREDENTIALS = {
      username: "anzaaleem",
      passcode: "lenscraft2026"
    };

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [usernameInput, setUsernameInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');

      // Check session authentication on load
      useEffect(() => {
        const sessionAuth = sessionStorage.getItem('lenscraft_admin_authenticated');
        if (sessionAuth === 'true') {
          setIsAuthenticated(true);
        }
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        if (
          usernameInput.trim() === ADMIN_CREDENTIALS.username &&
          passwordInput.trim() === ADMIN_CREDENTIALS.passcode
        ) {
          setIsAuthenticated(true);
          sessionStorage.setItem('lenscraft_admin_authenticated', 'true');
          setLoginError('');
          showToast("Access Granted: Welcome back, Studio Director.");
        } else {
          setLoginError("Invalid Studio Director username or password.");
        }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        sessionStorage.removeItem('lenscraft_admin_authenticated');
        setUsernameInput('');
        setPasswordInput('');
        showToast("Logged out of Admin Portal.");
      };

      if (!isAuthenticated) {
        return (
          <div className="admin-wrapper">
            <header className="admin-top-bar">
              <div className="admin-brand">
                Lens<span>Craft</span>
                <span className="admin-badge-lock">Restricted Portal</span>
              </div>
              <a href="index.html" className="btn btn-outline btn-sm">Return to Studio Website</a>
            </header>

            <main className="login-overlay">
              <div className="login-card">
                <div className="login-icon">🔒</div>
                <h2>Studio Director Login</h2>
                <p>Private management portal for LensCraft Photography Studio. Please verify your credentials to view client booking inquiries.</p>

                {loginError && (
                  <div style={{ background: 'rgba(239, 68, 68, 0.15)', border: '1px solid #ef4444', color: '#f87171', padding: '0.65rem 1rem', borderRadius: '6px', fontSize: '0.85rem', marginBottom: '1.25rem' }}>
                    {loginError}
                  </div>
                )}

                <form onSubmit={handleLogin}>
                  <div className="login-field">
                    <label>Admin Username</label>
                    <input
                      type="text"
                      placeholder="Enter admin username"
                      value={usernameInput}
                      onChange={(e) => setUsernameInput(e.target.value)}
                      required
                    />
                  </div>

                  <div className="login-field">
                    <label>Security Password</label>
                    <input
                      type="password"
                      placeholder="Enter security password"
                      value={passwordInput}
                      onChange={(e) => setPasswordInput(e.target.value)}
                      required
                    />
                  </div>

                  <button type="submit" className="btn btn-primary btn-block" style={{ marginTop: '1rem' }}>
                    Unlock Dashboard
                  </button>
                </form>

                <div className="login-hint">
                  <strong>Demo Studio Credentials:</strong><br />
                  Username: <span style={{ color: 'var(--accent-gold)' }}>anzaaleem</span><br />
                  Password: <span style={{ color: 'var(--accent-gold)' }}>lenscraft2026</span>
                </div>
              </div>
            </main>
          </div>
        );
      }

      // AUTHENTICATED DASHBOARD VIEW
      return <AdminDashboard onLogout={handleLogout} />;
    }

    function AdminDashboard({ onLogout }) {
      const [bookings, setBookings] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [filterCategory, setFilterCategory] = useState('all');
      const [filterStatus, setFilterStatus] = useState('all');

      useEffect(() => {
        const stored = JSON.parse(localStorage.getItem('lenscraft_inquiries') || '[]');
        if (stored.length === 0) {
          const sampleData = [
            {
              id: 1730280000001,
              name: "Zara & Hamza",
              email: "zara.hamza@example.com",
              phone: "+92 300 4567890",
              service: "Wedding Photography",
              package: "Standard Package ($599)",
              budget: "$500 - $1,000",
              date: "2026-11-15",
              time: "Golden Hour / Sunset",
              location: "Serena Hotel, Islamabad",
              status: "Confirmed",
              message: "Grand reception coverage with outdoor couple photoshoot.",
              submittedAt: "10/28/2026, 4:15 PM"
            },
            {
              id: 1730280000002,
              name: "Julian Vance",
              email: "julian.vance@venture.io",
              phone: "+92 321 9876543",
              service: "Portrait and Personal Branding Photography",
              package: "Basic Package ($299)",
              budget: "Under $500",
              date: "2026-11-04",
              time: "Midday Studio",
              location: "LensCraft Daylight Studio",
              status: "Pending",
              message: "Executive headshots for corporate website re-launch.",
              submittedAt: "10/29/2026, 11:30 AM"
            },
            {
              id: 1730280000003,
              name: "Maison V Atelier",
              email: "press@maisonv.com",
              phone: "+92 333 1122334",
              service: "Fashion and Model Photography",
              package: "Premium Package ($1,199)",
              budget: "$1,000 - $2,500",
              date: "2026-11-20",
              time: "Morning Light",
              location: "Highline Studio & Rooftop",
              status: "Completed",
              message: "Autumn/Winter Couture Lookbook 8 models.",
              submittedAt: "10/29/2026, 2:45 PM"
            }
          ];
          localStorage.setItem('lenscraft_inquiries', JSON.stringify(sampleData));
          setBookings(sampleData);
        } else {
          setBookings(stored.map(b => ({ ...b, status: b.status || 'Pending' })));
        }
      }, []);

      const handleStatusChange = (id, newStatus) => {
        const updated = bookings.map(b => b.id === id ? { ...b, status: newStatus } : b);
        setBookings(updated);
        localStorage.setItem('lenscraft_inquiries', JSON.stringify(updated));
        showToast(`Status updated: ${newStatus}`);
      };

      const handleDelete = (id) => {
        if (confirm("Permanently delete this inquiry?")) {
          const updated = bookings.filter(b => b.id !== id);
          setBookings(updated);
          localStorage.setItem('lenscraft_inquiries', JSON.stringify(updated));
          showToast("Booking deleted.");
        }
      };

      const handleClearAll = () => {
        if (confirm("Reset and clear all saved inquiries?")) {
          setBookings([]);
          localStorage.removeItem('lenscraft_inquiries');
          showToast("All inquiries cleared.");
        }
      };

      const filtered = bookings.filter(b => {
        const matchesSearch = (
          (b.name && b.name.toLowerCase().includes(searchTerm.toLowerCase())) ||
          (b.email && b.email.toLowerCase().includes(searchTerm.toLowerCase())) ||
          (b.phone && b.phone.includes(searchTerm)) ||
          (b.location && b.location.toLowerCase().includes(searchTerm.toLowerCase()))
        );
        const matchesCategory = filterCategory === 'all' || (b.service && b.service.includes(filterCategory));
        const matchesStatus = filterStatus === 'all' || (b.status === filterStatus);
        return matchesSearch && matchesCategory && matchesStatus;
      });

      const totalBookings = bookings.length;
      const pendingCount = bookings.filter(b => b.status === 'Pending').length;
      const confirmedCount = bookings.filter(b => b.status === 'Confirmed').length;
      const totalEstimatedValue = bookings.reduce((sum, b) => {
        if (b.package && b.package.includes('299')) return sum + 299;
        if (b.package && b.package.includes('599')) return sum + 599;
        if (b.package && b.package.includes('1,199')) return sum + 1199;
        return sum + 450;
      }, 0);

      return (
        <div className="admin-wrapper">
          {/* Admin Header */}
          <header className="admin-top-bar">
            <div className="admin-brand">
              Lens<span>Craft</span>
              <span className="admin-badge-lock">Management Studio</span>
            </div>

            <div style={{ display: 'flex', gap: '1rem', alignItems: 'center' }}>
              <span style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>
                Signed in as: <strong style={{ color: 'var(--accent-gold)' }}>Anza Aleem</strong>
              </span>
              <a href="index.html" target="_blank" className="btn btn-outline btn-sm">Preview Public Site</a>
              <button onClick={onLogout} className="btn btn-primary btn-sm" style={{ background: '#ef4444', borderColor: '#ef4444', color: '#fff' }}>
                Sign Out
              </button>
            </div>
          </header>

          <main className="dashboard-container">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: '2.5rem', flexWrap: 'wrap', gap: '1rem' }}>
              <div>
                <span className="section-tag" style={{ color: 'var(--accent-gold)' }}>Studio Operations</span>
                <h1 style={{ fontSize: 'clamp(2rem, 3.8vw, 3rem)' }}>Private Bookings Registry</h1>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.98rem' }}>
                  Restricted backoffice to monitor, approve, and manage client photography sessions.
                </p>
              </div>
              <div style={{ display: 'flex', gap: '0.75rem' }}>
                <button onClick={() => window.print()} className="btn btn-outline btn-sm">
                  Export PDF Report
                </button>
                <button onClick={handleClearAll} className="btn btn-outline btn-sm" style={{ color: '#ef4444', borderColor: '#ef4444' }}>
                  Clear Records
                </button>
              </div>
            </div>

            {/* Metrics */}
            <div className="stats-grid">
              <div className="stat-card">
                <div className="stat-icon">📅</div>
                <div className="stat-info">
                  <h4>Total Received</h4>
                  <div className="stat-value">{totalBookings}</div>
                </div>
              </div>

              <div className="stat-card">
                <div className="stat-icon" style={{ color: '#eab308' }}>⏳</div>
                <div className="stat-info">
                  <h4>Pending Review</h4>
                  <div className="stat-value">{pendingCount}</div>
                </div>
              </div>

              <div className="stat-card">
                <div className="stat-icon" style={{ color: '#22c55e' }}>✓</div>
                <div className="stat-info">
                  <h4>Confirmed Shoots</h4>
                  <div className="stat-value">{confirmedCount}</div>
                </div>
              </div>

              <div className="stat-card">
                <div className="stat-icon" style={{ color: 'var(--accent-gold)' }}>💰</div>
                <div className="stat-info">
                  <h4>Pipeline Value</h4>
                  <div className="stat-value">${totalEstimatedValue.toLocaleString()}</div>
                </div>
              </div>
            </div>

            {/* Inquiries Table */}
            <div className="table-container">
              <div className="table-header-bar">
                <div>
                  <h3 style={{ fontSize: '1.35rem', color: 'var(--text-main)', marginBottom: '0.2rem' }}>Client Appointment Registry</h3>
                  <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>
                    Showing {filtered.length} of {totalBookings} inquiries
                  </p>
                </div>

                <div style={{ display: 'flex', gap: '0.75rem', flexWrap: 'wrap' }}>
                  <input
                    type="text"
                    className="search-input"
                    placeholder="Search client, email, phone, venue..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                  />

                  <select
                    className="form-control"
                    style={{ width: 'auto', padding: '0.6rem 1rem', borderRadius: '50px' }}
                    value={filterCategory}
                    onChange={(e) => setFilterCategory(e.target.value)}
                  >
                    <option value="all">All Services</option>
                    <option value="Wedding">Wedding</option>
                    <option value="Portrait">Portrait</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Corporate">Corporate / Event</option>
                    <option value="Product">Product</option>
                  </select>

                  <select
                    className="form-control"
                    style={{ width: 'auto', padding: '0.6rem 1rem', borderRadius: '50px' }}
                    value={filterStatus}
                    onChange={(e) => setFilterStatus(e.target.value)}
                  >
                    <option value="all">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Completed">Completed</option>
                  </select>
                </div>
              </div>

              {filtered.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '3.5rem 1rem', color: 'var(--text-muted)' }}>
                  <h4>No matching inquiries found</h4>
                  <p style={{ fontSize: '0.9rem', marginTop: '0.5rem' }}>Clear your search query or submit a test inquiry on the Booking page.</p>
                </div>
              ) : (
                <table className="data-table">
                  <thead>
                    <tr>
                      <th>Client Contact</th>
                      <th>Service & Package</th>
                      <th>Schedule & Venue</th>
                      <th>Status</th>
                      <th>Received</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.map(item => (
                      <tr key={item.id}>
                        <td>
                          <strong style={{ color: 'var(--text-main)', fontSize: '0.96rem' }}>{item.name}</strong>
                          <div style={{ fontSize: '0.82rem', color: 'var(--accent-gold)' }}>{item.email}</div>
                          <div style={{ fontSize: '0.82rem', color: 'var(--text-muted)' }}>{item.phone}</div>
                        </td>
                        <td>
                          <div style={{ fontWeight: '600' }}>{item.service}</div>
                          <div style={{ fontSize: '0.82rem', color: 'var(--text-muted)' }}>{item.package}</div>
                          {item.budget && (
                            <span style={{ fontSize: '0.75rem', background: 'var(--bg-secondary)', padding: '2px 6px', borderRadius: '4px', border: '1px solid var(--border-color)' }}>
                              Budget: {item.budget}
                            </span>
                          )}
                        </td>
                        <td>
                          <div style={{ color: 'var(--text-main)', fontWeight: '500' }}>📅 {item.date}</div>
                          <div style={{ fontSize: '0.82rem', color: 'var(--text-muted)' }}>🕒 {item.time || 'Standard Call'}</div>
                          <div style={{ fontSize: '0.82rem', color: 'var(--text-muted)' }}>📍 {item.location}</div>
                        </td>
                        <td>
                          <span className={`status-badge status-${item.status.toLowerCase()}`}>
                            {item.status}
                          </span>
                        </td>
                        <td style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>
                          {item.submittedAt || 'Recent'}
                        </td>
                        <td>
                          <div className="action-btn-group">
                            {item.status !== 'Confirmed' && (
                              <button
                                onClick={() => handleStatusChange(item.id, 'Confirmed')}
                                className="btn btn-outline btn-sm"
                                style={{ padding: '0.35rem 0.65rem', fontSize: '0.75rem', color: '#22c55e', borderColor: '#22c55e' }}
                                title="Approve Booking"
                              >
                                Approve
                              </button>
                            )}
                            {item.status !== 'Completed' && (
                              <button
                                onClick={() => handleStatusChange(item.id, 'Completed')}
                                className="btn btn-outline btn-sm"
                                style={{ padding: '0.35rem 0.65rem', fontSize: '0.75rem', color: '#3b82f6', borderColor: '#3b82f6' }}
                                title="Mark Completed"
                              >
                                Complete
                              </button>
                            )}
                            <a
                              href={`mailto:${item.email}?subject=Regarding Your LensCraft Photography Session&body=Dear ${encodeURIComponent(item.name)},%0D%0A%0D%0AThank you for booking with LensCraft Photography Studio!`}
                              className="btn btn-outline btn-sm"
                              style={{ padding: '0.35rem 0.65rem', fontSize: '0.75rem' }}
                              title="Email Client"
                            >
                              Email
                            </a>
                            <button
                              onClick={() => handleDelete(item.id)}
                              className="btn btn-outline btn-sm"
                              style={{ padding: '0.35rem 0.65rem', fontSize: '0.75rem', color: '#ef4444', borderColor: 'rgba(239, 68, 68, 0.3)' }}
                              title="Delete"
                            >
                              ✕
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('react-admin-root')).render(<App />);
  </script>
</body>
</html>
